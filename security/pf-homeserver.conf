# Remote-access ports only answer on loopback and Tailscale (100.64.0.0/10, fd7a:115c:a1e0::/48).
# Anything arriving over Wi-Fi / Ethernet / IPv6-from-the-internet to these ports is silently dropped.
#   22 SSH · 53 DNS · 88 Kerberos · 445 SMB · 548 AFP · 3283 Remote Management · 5900 Screen Sharing
#   5000 / 7000 / 7100 AirPlay receiver
remote_ports = "{ 22, 53, 88, 445, 548, 3283, 5000, 5900, 7000, 7100 }"
pass  in quick on lo0 all
pass  in quick inet  proto { tcp, udp } from 100.64.0.0/10       to any port $remote_ports
pass  in quick inet6 proto { tcp, udp } from fd7a:115c:a1e0::/48 to any port $remote_ports
block drop in quick proto { tcp, udp } to any port $remote_ports
