const C = { blue: "#0a84ff", green: "#30d158", orange: "#ff9f0a", red: "#ff453a", purple: "#bf5af2", pink: "#ff375f", teal: "#32ade6", indigo: "#5e5ce6", gray: "#8e8e93", mint: "#00c7be", yellow: "#ffcc00" };
const icon = n => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n] || ""}"/></svg>`;
const badge = (n, c) => `<span class="badge" style="--c:${C[c] || c}">${icon(n)}</span>`;
const card = (ic, color, title, body, extra = "") => `<div class="card" ${extra}><h2>${badge(ic, color)}${esc(title)}</h2>${body}</div>`;
const kvrow = (k, v) => `<div class="row"><div class="grow">${k}</div><div style="text-align:right">${v}</div></div>`;
const pill = (t, cls = "") => `<span class="pill ${cls}">${t}</span>`;
function dayText(ds, W) {
  const k = [...ds].sort((a, b) => a - b).join(",");
  if (ds.length === 7) return "每天";
  if (k === "0,1,2,3,4") return "平日（週一至週五）";
  if (k === "5,6") return "週末";
  const run = ds.length > 2 && ds.every((v, i, a) => i === 0 || v === a[i - 1] + 1);
  return run ? `週${W[ds[0]]}至週${W[ds[ds.length - 1]]}` : "週" + ds.map(x => W[x]).join("、");
}
const mini = rows => `<div class="mini-grid">${rows.map(([k, v]) => `<div class="mini"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>`;
function ringTile(label, ic, c, value, sub, pct) {
  const p = pct == null ? null : Math.max(0, Math.min(100, pct)), R = 40, L = 2 * Math.PI * R;
  return `<div class="card tile ring" style="--c:${C[c]}">
    <div class="ringbox"><svg viewBox="0 0 96 96"><circle class="trk" cx="48" cy="48" r="${R}"/>${p != null && p >= 0.5 ? `<circle class="val" cx="48" cy="48" r="${R}" stroke-dasharray="${(p / 100 * L).toFixed(1)} ${L.toFixed(1)}"/>` : ""}</svg>
      <div class="rv ${String(value).length > 4 ? "small" : ""}">${value}</div></div>
    <div class="rl">${badge(ic, c)}${label}</div><div class="sub">${sub}</div></div>`;
}
function toast(msg, ic) { const t = $("#toast"); t.innerHTML = (ic ? icon(ic) + " " : "") + esc(msg); t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }

// ---------- theme ----------
const THEME_ICON = { auto: icon("auto"), light: icon("sun"), dark: icon("moon") };
const currentTheme = () => document.documentElement.dataset.theme || "auto";
function syncTheme() {
  const dark = currentTheme() === "dark" || (currentTheme() === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  $("#themeColor").content = dark ? "#05060a" : "#eef1f8"; $("#themeBtn").innerHTML = THEME_ICON[currentTheme()];
}
$("#themeBtn").onclick = () => { const next = { auto: "light", light: "dark", dark: "auto" }[currentTheme()];
  if (next === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch {} syncTheme(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncTheme); syncTheme();
// ---------- large text (for elders) ----------
function syncBig() { const on = document.documentElement.classList.contains("big"); $("#bigBtn").innerHTML = icon("type"); $("#bigBtn").classList.toggle("on", on); $("#bigBtn").setAttribute("aria-pressed", on); }
$("#bigBtn").onclick = () => { const on = document.documentElement.classList.toggle("big"); try { localStorage.setItem("big", on ? "1" : "0"); } catch {} syncBig(); toast(on ? "已切換成大字" : "已切換成一般大小", "type"); };
syncBig();

// ---------- data ----------
const BASE = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
const loadJs = f => new Promise(res => { const sc = document.createElement("script"); sc.src = BASE + f; sc.onload = res; sc.onerror = res; document.head.appendChild(sc); });
const qrLib = loadJs("qrcode.js"), driveLib = loadJs("drive.js");
var DRV = null;
var D = null;
var LOCKED = false;  // on the password screen: don't poll anything that needs a login

// avatar: uploaded photo > emoji > first letter, on the member's colour
function avatarHtml(pr, name, cls = "") {
  pr = pr || {};
  const inner = pr.photo ? `<img src="${BASE}avatar.jpg?v=${pr.v || 0}" alt="">` : pr.emoji ? `<span class="emo">${esc(pr.emoji)}</span>` : esc([...(name || "?")][0].toUpperCase());
  return `<span class="pav ${cls}" style="--c:${esc(pr.color || "#5e5ce6")}">${inner}</span>`;
}
async function showLock() {
  LOCKED = true;
  let info = {};
  try { info = await (await fetch(BASE + "lockinfo", { cache: "no-store" })).json(); } catch {}
  $("#liveDot").className = "dot";
  $("#pageSub").textContent = "需要密碼";
  $("#app").innerHTML = `<div class="card lockscreen">${avatarHtml(info, info.name)}
    <h2 style="justify-content:center;margin:0 0 4px">嗨，${esc(info.name || "")}</h2><div class="small muted">為了安全，請輸入管理員給你的密碼</div>
    <form id="pwForm"><input type="password" id="pwIn" placeholder="密碼" autocomplete="current-password" autofocus><button class="btn primary">進入</button></form>
    <div class="small" id="pwErr" style="color:var(--bad);min-height:20px;margin-top:8px"></div>
    <div class="small muted">這台裝置會記住 30 天，不用每次都輸入。忘記密碼請問管理員。</div></div>`;
  $("#pwForm").onsubmit = async e => {
    e.preventDefault();
    const r = await fetch(BASE + "login", { method: "POST", headers: { "Content-Type": "application/json", "X-Requested-With": "portal" }, body: JSON.stringify({ password: $("#pwIn").value }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { LOCKED = false; D = null; load(); loadMsgs(); loadBugs(); toast("歡迎回來", "ok"); } else { $("#pwErr").textContent = j.error || "密碼錯誤"; $("#pwIn").select(); }
  };
}

async function load() {
  try {
    const r = await fetch(BASE + "me", { cache: "no-store" });
    if (r.status === 401) { if (!$("#pwForm")) showLock(); return; }
    if (!r.ok) throw new Error(r.status === 404 ? "這個網址已失效，請向管理員索取新的網址" : r.status === 429 ? "嘗試太多次，請稍後再試" : "HTTP " + r.status);
    D = await r.json(); $("#liveDot").className = "dot on";
    const ta = $("#msgText"); if (ta && (ta.value || document.activeElement === ta)) return;  // don't wipe a half-typed message
    if ([...document.querySelectorAll("[data-bugreply]")].some(i => i.value || document.activeElement === i)) return;
    render();
  } catch (e) {
    $("#liveDot").className = "dot off";

  BUGF = { area: "page", severity: "minor", shots: [] };
  const A = BUGS ? BUGS.areas : { cloud: "雲端硬碟", net: "上網／連線", sr: "Shadowrocket", page: "專屬網頁", other: "其他" };
  const V = BUGS ? BUGS.severities : { minor: "小問題", annoying: "有點影響", blocker: "完全不能用" };
  $("#bugForm").innerHTML = `<div class="bugf">
    <div class="sect"><div class="st">哪裡有問題？</div><div class="chipbtns" data-bg="area">${Object.entries(A).filter(([k]) => k !== "sr" || (D && D.shadowrocket.on)).map(([k, l]) => `<button class="chipbtn ${k === BUGF.area ? "on" : ""}" data-v="${k}">${esc(l)}</button>`).join("")}</div></div>
    <div class="sect"><div class="st">有多嚴重？</div><div class="chipbtns" data-bg="severity">${Object.entries(V).map(([k, l]) => `<button class="chipbtn ${k === BUGF.severity ? "on" : ""}" data-v="${k}">${esc(l)}</button>`).join("")}</div></div>
    <div class="sect"><div class="st">用一句話說發生什麼事</div><input type="text" id="bugTitleIn" maxlength="80" placeholder="例如：上傳照片一直失敗"></div>
    <div class="sect"><div class="st">詳細說明（可以不填）</div><textarea id="bugDescIn" maxlength="3000" placeholder="你做了什麼、看到什麼、本來以為會怎樣"></textarea></div>
    <div class="sect"><div class="st">截圖（最多 3 張，可以不附）</div><label class="btn sm">${icon("camera")}選擇截圖<input type="file" accept="image/*" multiple hidden id="bugShotIn"></label><div class="shotprev" id="bugShotPrev"></div></div>
    <div class="sect"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="bugDevIn" checked> 附上手機型號和瀏覽器資訊（方便找原因）</label></div>
    <div class="btns" style="padding:10px 0 4px"><button class="btn primary" id="bugSend">${icon("send")}送出回報</button></div></div>`;
  $("#bugSheet").hidden = false;
}
document.addEventListener("click", async e => {
  const t = e.target;
  if (t.closest("#bugNew")) return openBugForm();
  if (t.closest("#bugCancel") || t.id === "bugSheet") { $("#bugSheet").hidden = true; return; }
  const c = t.closest("#bugForm .chipbtn"); if (c) { const g = c.parentElement.dataset.bg; BUGF[g] = c.dataset.v; c.parentElement.querySelectorAll(".chipbtn").forEach(x => x.classList.toggle("on", x === c)); return; }
  if (t.closest("#bugSend")) {
    const b = t.closest("#bugSend"); b.disabled = true;
    try {
      const dev = $("#bugDevIn").checked ? { ua: navigator.userAgent, screen: `${screen.width}×${screen.height} @${devicePixelRatio}x`, page: location.pathname.replace(/\/p\/[0-9a-f]+/, "/p/…"), lang: navigator.language } : null;
      const j = await post("bug", { title: $("#bugTitleIn").value, desc: $("#bugDescIn").value, area: BUGF.area, severity: BUGF.severity, device: dev });
      for (const f of BUGF.shots) {
        const r = await fetch(BASE + "bug/" + j.id + "/shot", { method: "POST", headers: { "X-Requested-With": "portal" }, body: f });
        if (!r.ok) { const x = await r.json().catch(() => ({})); toast("截圖：" + (x.error || r.status), "alert"); }
      }
      $("#bugSheet").hidden = true; toast("已送出，管理員會收到通知", "ok"); loadBugs();
    } catch (err) { toast(err.message, "alert"); }
    b.disabled = false; return;
  }
  const sd = t.closest("[data-bugsend]"); if (sd) { const inp = document.querySelector(`[data-bugreply="${sd.dataset.bugsend}"]`);
    try { await post("bug/" + sd.dataset.bugsend + "/reply", { text: inp.value }); toast("已送出", "ok"); loadBugs(); } catch (err) { toast(err.message, "alert"); } }
});
document.addEventListener("change", e => {
  if (e.target.id !== "bugShotIn") return;
  BUGF.shots = [...e.target.files].slice(0, 3);
  if (e.target.files.length > 3) toast("最多 3 張，只取前 3 張", "alert");
  // data: URLs (the page's CSP doesn't allow blob: images)
  // data: URLs (the page's CSP doesn't allow blob: images); a generation number drops previews from an older pick
  const gen = (BUGF.gen = (BUGF.gen || 0) + 1), box = $("#bugShotPrev");
  box.innerHTML = BUGF.shots.map(() => `<img alt="">`).join("");
  BUGF.shots.forEach((f, k) => { const r = new FileReader(); r.onload = () => { if (BUGF.gen === gen && box.children[k]) box.children[k].src = r.result; }; r.readAsDataURL(f); });
});

// ---------- messages ----------
const MSGT = { extend: "延長使用期限", quota: "加大雲端容量", time: "增加每日時數", help: "需要幫忙", other: "其他" };
var MYMSG = null;
async function loadMsgs() { if (LOCKED) return; try { const r = await fetch(BASE + "messages", { cache: "no-store" }); if (r.ok) { MYMSG = (await r.json()).items; renderMsgs(); } } catch {} }
function renderMsgs() {
  const el = $("#myMsgs"); if (!el || !MYMSG) return;
  el.innerHTML = MYMSG.length ? `<div class="small muted" style="margin:14px 0 2px">之前的留言</div>` + MYMSG.slice(0, 5).map(m => `<div class="row" style="align-items:flex-start">
      ${badge(m.done ? "tick" : "clock", m.done ? "green" : "orange")}<div class="grow"><div class="t">${esc(MSGT[m.kind] || m.kind)}</div>
      <div class="s">${new Date(m.at * 1000).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}・${m.done ? "已處理" : "等待回覆"}</div>
      ${m.text ? `<div class="msg-text">${esc(m.text)}</div>` : ""}${m.reply ? `<div class="msg-text" style="color:var(--accent)">${icon("reply")} 管理員：${esc(m.reply)}</div>` : ""}</div></div>`).join("") : "";
}
async function sendMsg() {
  const b = $("#msgSend"), on = $("#msgKinds .chipbtn.on"), kind = on ? on.dataset.mk : "other";
  b.disabled = true;
  try {
    const r = await fetch(BASE + "message", { method: "POST", headers: { "Content-Type": "application/json", "X-Requested-With": "portal" }, body: JSON.stringify({ kind, text: $("#msgText").value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || "送出失敗");
    $("#msgText").value = ""; toast("已送出，管理員會收到通知", "ok"); loadMsgs();
  } catch (e) { toast(e.message, "alert"); }
  b.disabled = false;
}

// ---------- speed test ----------
async function speedTest() {
  const b = $("#speedBtn"), o = $("#speedOut"); b.disabled = true; o.innerHTML = `<div class="small muted" style="margin-top:6px">測試下載中…</div>`;
  try {
    let t = performance.now(); const r = await fetch(BASE + "speed/down?mb=10", { cache: "no-store" }); const n = (await r.arrayBuffer()).byteLength;
    const down = n * 8 / ((performance.now() - t) / 1000) / 1e6;
    o.innerHTML = `<div class="small muted" style="margin-top:6px">測試上傳中…</div>`;
    const blob = new Blob([new Uint8Array(5 << 20).map(() => Math.random() * 256)]);
    t = performance.now(); const r2 = await fetch(BASE + "speed/up", { method: "POST", headers: { "X-Requested-With": "portal" }, body: blob });
    if (!r2.ok) throw new Error("HTTP " + r2.status);
    const up = blob.size * 8 / ((performance.now() - t) / 1000) / 1e6;
    o.innerHTML = `<div class="speed-out"><div class="mini"><div class="k">${icon("down")} 下載</div><div class="v">${down.toFixed(1)} Mbps</div></div>
      <div class="mini"><div class="k">${icon("up")} 上傳</div><div class="v">${up.toFixed(1)} Mbps</div></div></div>
      <div class="small muted" style="margin-top:6px">${down > 20 ? "很快，看影片沒問題" : down > 5 ? "還不錯，一般使用沒問題" : "比較慢，可能是網路不好"}</div>`;
  } catch (e) { o.innerHTML = `<div class="small muted" style="margin-top:6px">測試失敗：${esc(e.message)}</div>`; }
  b.disabled = false;
}

load().then(() => { loadMsgs(); loadBugs(); }); setInterval(() => { if (!document.hidden) { load(); loadMsgs(); loadBugs(); } }, 60000);
</script>
</body>
